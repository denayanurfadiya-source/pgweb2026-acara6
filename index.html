<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/anshori/Leaflet.awesome-markers@master/dist/leaflet.awesome-markers.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://sig.sv.ugm.ac.id/" target="_blank"><i
                                class="bi bi-link-45deg"></i>SIG UGM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#exampleModal"><i
                                class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Modal About -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Nama: Denaya Nur Fadiya</p>
                    <p>NIM: 25/561063/SV/26508</p>
                    <p>Kelas: B</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Feature Jumlah Penduduk -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="feature-title"></h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="feature-info"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/gh/anshori/Leaflet.awesome-markers@master/dist/leaflet.awesome-markers.js"></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3195434, 123.1704712], 11);

        // Pengaturan Z-Index Layer dengan Map Pane
        map.createPane('poligonPane');
        map.getPane('poligonPane').style.zIndex = 300;

        map.createPane('garisPane');
        map.getPane('garisPane').style.zIndex = 400;

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi
        var toponimi = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                var unsur = (feature.properties.NAMA_UNSUR || "").toLowerCase();
                var iconName = "home";
                var mColor = "green";

                if (unsur.includes("gunung")) {
                    iconName = "mountain";
                    mColor = "red";
                } else if (unsur.includes("tanjung")) {
                    iconName = "flag";
                    mColor = "orange";
                } else if (unsur.includes("teluk")) {
                    iconName = "water";
                    mColor = "blue";
                } else {
                    iconName = "home";
                    mColor = "green";
                }

                return L.marker(latlng, {
                    icon: L.AwesomeMarkers.icon({
                        icon: iconName,
                        prefix: "fa",
                        markerColor: mColor,
                        color: mColor,
                        iconColor: "white",
                    }),
                });
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Kategori: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0];
                var imgPath = feature.properties.image ? ("images/" + feature.properties.image) : "pulau_Solor.jpg";
                popup_content += "<br><img src='" + imgPath + "' alt='' width='200'>";
                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },

        });



        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point Toponimi
            map.addLayer(toponimi); // Menambahkan GeoJSON Point Toponimi ke dalam peta
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: "garisPane",
            // Style
            style: function (feature) {
                var namaUnsur = (feature.properties.NAMA_UNSUR || "").toLowerCase();
                if (namaUnsur.includes("provinsi") || namaUnsur.includes("propinsi")) {
                    return {
                        color: "red",
                        weight: 3,
                        opacity: 1,
                    };
                }
                if (namaUnsur.includes("kabupaten")) {
                    return {
                        color: "red",
                        weight: 1.5,
                        dashArray: "10, 6",
                        opacity: 1,
                    };
                }
                return {
                    color: "red",
                    weight: 0.5,
                    dashArray: "3, 3",
                    opacity: 1,
                };
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data); // Menambahkan data ke dalam GeoJSON Polyline Jalan
            map.addLayer(jalan); // Menambahkan GeoJSON Polyline Jalan ke dalam peta
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: "poligonPane",
            // Style
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    }
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    }
                }
                if (feature.properties.Penduduk > 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    }
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                var kecamatan = feature.properties.kecamatan || feature.properties.WADMKC || "-";
                var desa = feature.properties.desa || feature.properties.NAMOBJ || "-";
                var penduduk = feature.properties.Penduduk ? feature.properties.Penduduk.toLocaleString("id-ID") : "-";

                // variable popup/modal content
                var popup_content = "<table class='table table-striped table-bordered'>" +
                    "<tr><th>Kecamatan</th><td>" + kecamatan + "</td></tr>" +
                    "<tr><th>Desa/Kelurahan</th><td>" + desa + "</td></tr>" +
                    "<tr><th>Jumlah Penduduk</th><td>" + penduduk + " Jiwa</td></tr>" +
                    "</table>";

                layer.on({
                    click: function (e) {
                        $("#feature-title").html("Jumlah Penduduk - " + desa);
                        $("#feature-info").html(popup_content);
                        $("#featureModal").modal("show");
                    },
                    mouseover: function (e) {
                        jumlah_penduduk.bindTooltip(desa, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var overlayMaps = {};
        overlayMaps[
            "Toponimi<br>" +
            "<span style='margin-left:20px;'><i class='fa-solid fa-mountain' style='color:red;'></i> Gunung</span><br>" +
            "<span style='margin-left:20px;'><i class='fa-solid fa-flag' style='color:orange;'></i> Tanjung</span><br>" +
            "<span style='margin-left:20px;'><i class='fa-solid fa-water' style='color:blue;'></i> Teluk</span><br>" +
            "<span style='margin-left:20px;'><i class='fa-solid fa-house' style='color:green;'></i> Toponimi Lain</span>"
        ] = toponimi;
        overlayMaps[
            "Jalan<br>" +
            "<svg width='20' height='10' style='vertical-align:middle; margin-left:20px; margin-right:5px;'><line x1='0' y1='5' x2='20' y2='5' stroke='red' stroke-width='3'/></svg> Jalan Provinsi<br>" +
            "<svg width='20' height='10' style='vertical-align:middle; margin-left:20px; margin-right:5px;'><line x1='0' y1='5' x2='20' y2='5' stroke='red' stroke-width='1.5' stroke-dasharray='6, 3'/></svg> Jalan Kabupaten<br>" +
            "<svg width='20' height='10' style='vertical-align:middle; margin-left:20px; margin-right:5px;'><line x1='0' y1='5' x2='20' y2='5' stroke='red' stroke-width='0.5' stroke-dasharray='2, 2'/></svg> Jalan Lain"
        ] = jalan;
        overlayMaps[
            "Jumlah Penduduk<br>" +
            "<span style='display:inline-block; width:12px; height:12px; background-color:#ffffb2; border:1px solid #333; vertical-align:middle; margin-left:20px; margin-right:5px;'></span> &le; 12.000<br>" +
            "<span style='display:inline-block; width:12px; height:12px; background-color:#fd8d3c; border:1px solid #333; vertical-align:middle; margin-left:20px; margin-right:5px;'></span> 12.001 - 24.000<br>" +
            "<span style='display:inline-block; width:12px; height:12px; background-color:#bd0026; border:1px solid #333; vertical-align:middle; margin-left:20px; margin-right:5px;'></span> &gt; 24.000"
        ] = jumlah_penduduk;

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

    </script>
</body>

</html>
